name: Verify source and behavior

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.2.4'
      - name: Audit published tree and original licenses
        run: |
          python tools/audit_repository.py
          python tools/check_upstream.py
          python -m unittest discover -s tools/tests -v
      - name: Install pinned upstream tool dependencies
        working-directory: plugins/pstack/skills/poteto-mode/scripts
        run: bun install --frozen-lockfile
      - name: Adapter and fresh-user workflows
        run: |
          python -m unittest discover -s plugins/pstack/tests -v
          python tools/check_fresh_setup.py
      - name: Preserved upstream tools
        working-directory: plugins/pstack/skills/poteto-mode/scripts
        run: |
          bun run test
          bun run typecheck
      - name: Statechart compiler, replay and rendering
        working-directory: plugins/pstack/skills/statechart/scripts
        run: |
          npm install --no-package-lock --ignore-scripts --no-audit --no-fund
          npm test
      - name: Check statechart against live TLC
        working-directory: plugins/pstack/skills/statechart/scripts
        run: |
          export TLA2TOOLS="$RUNNER_TEMP/tla2tools.jar"
          curl --fail --location --silent --show-error --retry 3 \
            --output "$TLA2TOOLS" https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar
          echo "936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88  $TLA2TOOLS" | shasum -a 256 --check
          node --disable-warning=ExperimentalWarning --test \
            --test-name-pattern='^(Counter|CounterDeadlock) gives the committed chart and report when TLC runs$' \
            test/corpus.test.ts
