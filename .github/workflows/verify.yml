name: Verify source and behavior

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.2.4'
      - name: Audit published tree and original licenses
        run: |
          python tools/audit_repository.py
          python tools/check_upstream.py
          python -m unittest discover -s tools/tests -v
      - name: Install pinned upstream tool dependencies
        working-directory: plugins/pstack/skills/poteto-mode/scripts
        run: bun install --frozen-lockfile
      - name: Adapter and fresh-user workflows
        run: |
          python -m unittest discover -s plugins/pstack/tests -v
          python tools/check_fresh_setup.py
      - name: Preserved upstream tools
        working-directory: plugins/pstack/skills/poteto-mode/scripts
        run: |
          bun test orch watch-pr
          bun run typecheck
